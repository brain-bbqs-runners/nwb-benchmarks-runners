# Template for a per-runner (or per-situation) workflow.
#
# 1. Copy this file to .github/workflows/runner-<label>.yml
# 2. Replace every RUNNER_LABEL with the label you gave the self-hosted runner
#    (lowercase letters, digits, dashes, and underscores; e.g. `lbl_laptop`).
# 3. Pick a cron schedule (UTC). The runners run hourly, each run measuring one benchmark
#    chosen at random; pick a different minute than the other runners if several machines
#    share a network.
# 4. Uncomment and fill in the machine configuration your machine needs (often nothing).
# 5. Optionally pin a `benchmark_pattern` to make this a "situation" workflow that runs a
#    subset of the suite (e.g. only `time_remote_slicing`, or `.` for all of it) instead of one
#    benchmark chosen at random.
#
# Everything else is handled by .github/workflows/benchmarks.yml. See README.md for the
# full list of inputs.
name: Benchmarks (RUNNER_LABEL)

on:
  schedule:
    # Every hour; each run measures one benchmark chosen at random. Pick a different minute
    # than the other runners if several machines share a network.
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      benchmark_pattern:
        description: Optional `--bench` pattern; leave empty for one benchmark chosen at random
        required: false
        type: string
        default: ""
      nwb_benchmarks_ref:
        description: Branch, tag, or commit of nwb-benchmarks to run
        required: false
        type: string
        default: main
      debug:
        description: Debug mode (`--debug`; one repeat, verbose output, nothing uploaded)
        required: false
        type: boolean
        default: false
      upload:
        description: Upload results to the results repository
        required: false
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  benchmarks:
    uses: ./.github/workflows/benchmarks.yml
    with:
      runner: RUNNER_LABEL

      # --- Machine configuration (all optional) -----------------------------------------
      # conda_root: /opt/miniforge3                       # only to use a conda outside <runner>/_work
      # network_interface: eth0                           # default-route interface when omitted
      # tshark_path: /usr/bin/tshark                      # `tshark` on PATH when omitted
      # use_sudo: auto                                    # auto | true | false
      # cache_directory: /data/nwb_benchmarks_cache       # large downloads live here

      # --- Opt-in parts of the suite (left out when omitted) ------------------------------
      # run_download_benchmarks: true                     # whole-file downloads; long, needs disk
      # run_incremental_slicing_benchmarks: all           # or a modality list: icephys,ophys

      # --- Upload configuration (defaults to the central results repository) ------------
      # results_repository: <owner>/nwb-benchmarks-results   # e.g. a test repository
      # results_branch: dev                                # default branch when omitted

      # --- Run options, forwarded from the manual trigger form ------------------------
      # Scheduled runs never use debug mode and always upload.
      benchmark_pattern: ${{ inputs.benchmark_pattern || '' }}
      nwb_benchmarks_ref: ${{ inputs.nwb_benchmarks_ref || 'main' }}
      debug: ${{ github.event_name == 'workflow_dispatch' && inputs.debug }}
      upload: ${{ github.event_name != 'workflow_dispatch' || inputs.upload }}
    secrets:
      # The upload token all runners share (Settings > Secrets and variables > Actions). Only
      # the upload job, on a GitHub-hosted runner, uses it; this machine never receives it.
      RESULTS_UPLOAD_TOKEN: ${{ secrets.RESULTS_UPLOAD_TOKEN }}
