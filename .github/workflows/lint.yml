# Static checks for this repository's workflows and scripts. Runs on GitHub-hosted
# runners only; the self-hosted runners are never exposed to pull requests.
name: Lint

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  lint:
    name: actionlint and shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install actionlint
        run: |
          bash <(curl -sSf https://raw.githubusercontent.com/rhysd/actionlint/v1.7.7/scripts/download-actionlint.bash) 1.7.7 "$RUNNER_TEMP"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: actionlint
        run: actionlint -color

      - name: shellcheck
        run: shellcheck --shell=bash --external-sources --source-path=SCRIPTDIR .github/actions/benchmarks/scripts/*.sh

      - name: Validate the composite actions
        run: |
          # actionlint does not check action.yml files, so make sure each action parses, is a
          # composite action, and only references inputs it declares.
          python3 -m pip install --quiet pyyaml
          python3 - <<'PY'
          import glob, re, sys, yaml
          for path in sorted(glob.glob(".github/actions/*/action.yml")):
              action = yaml.safe_load(open(path))
              assert action["runs"]["using"] == "composite", f"{path}: not a composite action"
              declared = set(action["inputs"])
              referenced = set(re.findall(r"inputs\.([A-Za-z0-9_-]+)", open(path).read()))
              undeclared = referenced - declared
              assert not undeclared, f"{path}: undeclared inputs referenced: {sorted(undeclared)}"
              for step in action["runs"]["steps"]:
                  assert "uses" in step or "shell" in step, f"{path}: step without shell: {step.get('name')}"
              print(f"{path}: OK ({len(declared)} inputs, {len(action['runs']['steps'])} steps)")
          PY

      - name: Validate the runner template
        run: |
          # The template is a real workflow apart from its RUNNER_LABEL placeholder.
          mkdir -p "$RUNNER_TEMP/template-check/.github/workflows"
          cp .github/workflows/benchmarks.yml "$RUNNER_TEMP/template-check/.github/workflows/"
          sed -e 's/RUNNER_LABEL/example-runner/g' \
            templates/runner-workflow.yml > "$RUNNER_TEMP/template-check/.github/workflows/runner-example-runner.yml"
          cd "$RUNNER_TEMP/template-check" && git init --quiet && actionlint -color
