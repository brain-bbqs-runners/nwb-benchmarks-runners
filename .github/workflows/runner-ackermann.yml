# Scheduled benchmark runs on the self-hosted runner labeled `ackermann`
# (Cody Baker's machine).
#
# One file like this exists per runner or situation. It chooses WHEN to run, WHICH runner
# to use, how that machine is configured, and WHICH repository secret holds the runner's
# upload token. Everything else lives in benchmarks.yml. To add a runner, copy
# templates/runner-workflow.yml and follow README.md.
name: Benchmarks (ackermann)

on:
  schedule:
    # Every hour from noon to midnight Eastern time; each run measures one benchmark chosen at
    # random. Staggered from lbl-mac. Cron is UTC and ignores daylight saving, so these hours
    # cover both the EDT window (16:17 to 03:17 UTC) and the EST window (17:17 to 04:17 UTC),
    # and the `window` job below lets a run through only when it is really noon to midnight
    # in New York.
    - cron: "17 16-23 * * *"
    - cron: "17 0-4 * * *"
  workflow_dispatch:
    inputs:
      benchmark_pattern:
        description: Optional `--bench` pattern; leave empty for one benchmark chosen at random
        required: false
        type: string
        default: ""
      nwb_benchmarks_ref:
        description: Branch, tag, or commit of nwb-benchmarks to run
        required: false
        type: string
        default: main
      debug:
        description: Debug mode (`--debug`; one repeat, verbose output, nothing uploaded)
        required: false
        type: boolean
        default: false
      upload:
        description: Upload results to the results repository
        required: false
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  # Scheduled runs only go ahead between noon and midnight in New York; manual runs always do.
  window:
    runs-on: ubuntu-latest
    outputs:
      open: ${{ steps.check.outputs.open }}
    steps:
      - id: check
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          hour="$(TZ=America/New_York date +%H)"
          if [ "$EVENT_NAME" = workflow_dispatch ] || [ "$hour" -ge 12 ]; then
            echo "open=true" >> "$GITHUB_OUTPUT"
          else
            echo "open=false" >> "$GITHUB_OUTPUT"
            echo "It is ${hour}:xx in New York; scheduled runs only go ahead from noon to midnight."
          fi

  benchmarks:
    needs: window
    if: ${{ needs.window.outputs.open == 'true' }}
    uses: ./.github/workflows/benchmarks.yml
    with:
      runner: ackermann
      # Machine configuration is optional; see "Configuration reference" in README.md.
      # conda_root: /Users/cody/miniforge3
      # network_interface: en0
      # tshark_path: /Applications/Wireshark.app/Contents/MacOS/tshark
      # Keep the conda environment between runs; each run updates it instead of rebuilding it,
      # and it is rebuilt from scratch once a month.
      keep_conda_env: true
      # Every opt-in part of the suite is in the pool the random pick chooses from.
      run_download_benchmarks: true
      run_incremental_slicing_benchmarks: all
      # Run options, forwarded from the manual trigger form. Scheduled runs never use debug
      # mode and always upload.
      benchmark_pattern: ${{ inputs.benchmark_pattern || '' }}
      nwb_benchmarks_ref: ${{ inputs.nwb_benchmarks_ref || 'main' }}
      debug: ${{ github.event_name == 'workflow_dispatch' && inputs.debug }}
      upload: ${{ github.event_name != 'workflow_dispatch' || inputs.upload }}
    secrets:
      # Repository secret holding this runner's token: Settings > Secrets and variables > Actions.
      RESULTS_UPLOAD_TOKEN: ${{ secrets.RESULTS_UPLOAD_TOKEN_ACKERMANN }}
