# Manual entry point: run the benchmarks once on any registered self-hosted runner.
# Handy for smoke-testing a freshly registered runner (tick "debug") before giving it
# a scheduled workflow of its own.
name: Run benchmarks on a chosen runner

on:
  workflow_dispatch:
    inputs:
      runner:
        description: Self-hosted runner label (must match the name of its GitHub Environment)
        required: true
        type: string
      benchmark_pattern:
        description: Optional `--bench` pattern; leave empty for the full suite
        required: false
        type: string
        default: ""
      nwb_benchmarks_ref:
        description: Branch, tag, or commit of nwb-benchmarks to run
        required: false
        type: string
        default: main
      debug:
        description: Debug mode (`--debug`; one repeat, verbose output, nothing uploaded)
        required: false
        type: boolean
        default: false
      upload:
        description: Upload results to the results repository
        required: false
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  benchmarks:
    uses: ./.github/workflows/benchmarks.yml
    with:
      runner: ${{ inputs.runner }}
      benchmark_pattern: ${{ inputs.benchmark_pattern }}
      nwb_benchmarks_ref: ${{ inputs.nwb_benchmarks_ref || 'main' }}
      debug: ${{ inputs.debug }}
      upload: ${{ inputs.upload }}
    secrets: inherit
