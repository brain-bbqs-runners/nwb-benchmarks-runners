# Reusable workflow: runs the NWB Benchmarks suite on ONE self-hosted runner, then commits
# the results to the results repository from a GitHub-hosted runner.
#
# Do not schedule this workflow directly. Each runner (or "situation") gets its own small
# caller workflow, generated from templates/runner-workflow.yml, which picks the schedule,
# names the runner label, describes the machine through the inputs below, and passes the
# repository secret RESULTS_UPLOAD_TOKEN, the one upload token all runners share.
#
# Two jobs:
#   benchmarks  on the self-hosted runner: runs the suite and saves the result files still to
#               be uploaded as a workflow artifact (composite action .github/actions/benchmarks).
#               It never sees the upload token.
#   upload      on a GitHub-hosted runner: commits that artifact to the results repository
#               with the token (composite action .github/actions/upload-results).
# Both actions can also be used directly from other workflows.
name: Benchmarks

on:
  workflow_call:
    inputs:
      # --- Which runner -----------------------------------------------------------------
      runner:
        description: Label of the self-hosted runner to run on.
        required: true
        type: string

      # --- What to run ------------------------------------------------------------------
      nwb_benchmarks_repository:
        description: GitHub repository (owner/name) containing the benchmark suite.
        required: false
        type: string
        default: NeurodataWithoutBorders/nwb-benchmarks
      nwb_benchmarks_ref:
        description: Branch, tag, or commit of the benchmark suite to run.
        required: false
        type: string
        default: main
      benchmark_pattern:
        description: Optional `--bench` pattern selecting a subset of the suite. Empty runs one benchmark chosen at random (`nwb_benchmarks run --random`).
        required: false
        type: string
        default: ""
      debug:
        description: Run with `--debug` (one repeat, verbose output, nothing uploaded). Use it to smoke-test a new runner.
        required: false
        type: boolean
        default: false
      upload:
        description: Upload the results to the results repository (in a separate job on a GitHub-hosted runner).
        required: false
        type: boolean
        default: true
      run_download_benchmarks:
        description: Include the download benchmarks (whole NWB files through the DANDI API), which the suite leaves out by default; they are long and need bandwidth and disk space.
        required: false
        type: boolean
        default: false
      run_incremental_slicing_benchmarks:
        description: Include the incremental slicing benchmarks, which the suite leaves out by default. `all` for all of them, or a comma-separated list of modalities (`ecephys`, `ophys`, `icephys`). Empty leaves them out.
        required: false
        type: string
        default: ""
      timeout_minutes:
        description: Maximum duration of the job in minutes. The default is the 5-day maximum GitHub allows for jobs on self-hosted runners.
        required: false
        type: number
        default: 7200

      # --- Machine configuration (all optional) -----------------------------------------
      conda_root:
        description: Explicit conda installation to use (the directory containing etc/profile.d/conda.sh). Leave empty to use the Miniforge under the runner's _work folder installed by the Set up runner workflow; a conda on PATH is never used.
        required: false
        type: string
        default: ""
      conda_env_name:
        description: Name of the conda environment created at the start and removed at the end of every job.
        required: false
        type: string
        default: nwb_benchmarks_runner
      network_interface:
        description: Network interface for the network tracking benchmarks (en0, eth0, Ethernet, ...). Default route interface when empty.
        required: false
        type: string
        default: ""
      tshark_path:
        description: Absolute path of the tshark executable. When empty, the Wireshark copy under the runner's _work folder, then `tshark` on PATH, then common locations are tried.
        required: false
        type: string
        default: ""
      use_sudo:
        description: "`auto` uses sudo when it works without a password, `true` requires it, `false` never uses it."
        required: false
        type: string
        default: auto
      cache_directory:
        description: Directory for the suite's downloads and temporary files (`nwb_benchmarks config_set_cache`). Under the runner's _work folder when empty.
        required: false
        type: string
        default: ""
      keep_conda_env:
        description: Keep the conda environment between jobs; the next job updates it from the environment file instead of rebuilding it. A kept environment is rebuilt once it is 30 days old.
        required: false
        type: boolean
        default: false

      # --- Upload configuration ---------------------------------------------------------
      results_repository:
        description: Repository (owner/name) the results are committed to. The upload token needs write access to it.
        required: false
        type: string
        default: NeurodataWithoutBorders/nwb-benchmarks-results
      results_branch:
        description: Branch the results are committed to. Empty uses the default branch of results_repository.
        required: false
        type: string
        default: ""

    secrets:
      RESULTS_UPLOAD_TOKEN:
        description: >-
          Token with write access to results_repository: pass the repository secret
          RESULTS_UPLOAD_TOKEN. Only the upload job, on a GitHub-hosted runner, uses it.
          Not needed when upload is false or debug is true.
        required: false

permissions:
  contents: read

jobs:
  benchmarks:
    name: ${{ inputs.runner }}
    runs-on:
      - self-hosted
      - ${{ inputs.runner }}
    # Never run two benchmark jobs on the same machine at once; a second trigger waits.
    concurrency:
      group: nwb-benchmarks-${{ inputs.runner }}
      cancel-in-progress: false
    timeout-minutes: ${{ inputs.timeout_minutes }}
    outputs:
      pending_artifact: ${{ steps.benchmarks.outputs.pending-artifact }}
    steps:
      - name: Check out the benchmarks action
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Run the benchmarks and collect the result files to upload
        id: benchmarks
        uses: ./.github/actions/benchmarks
        with:
          runner-label: ${{ inputs.runner }}
          nwb-benchmarks-repository: ${{ inputs.nwb_benchmarks_repository }}
          nwb-benchmarks-ref: ${{ inputs.nwb_benchmarks_ref }}
          benchmark-pattern: ${{ inputs.benchmark_pattern }}
          debug: ${{ inputs.debug }}
          upload: ${{ inputs.upload }}
          run-download-benchmarks: ${{ inputs.run_download_benchmarks }}
          run-incremental-slicing-benchmarks: ${{ inputs.run_incremental_slicing_benchmarks }}
          conda-root: ${{ inputs.conda_root }}
          conda-env-name: ${{ inputs.conda_env_name }}
          network-interface: ${{ inputs.network_interface }}
          tshark-path: ${{ inputs.tshark_path }}
          use-sudo: ${{ inputs.use_sudo }}
          cache-directory: ${{ inputs.cache_directory }}
          keep-conda-env: ${{ inputs.keep_conda_env }}
          results-repository: ${{ inputs.results_repository }}
          results-branch: ${{ inputs.results_branch }}

  # Runs on a GitHub-hosted runner so the upload token never reaches the self-hosted machine.
  # If it fails, the machine keeps the files pending and sends them again with its next run;
  # re-running this job alone also works while the artifact is kept (7 days).
  upload:
    name: ${{ inputs.runner }} upload
    needs: benchmarks
    if: ${{ needs.benchmarks.outputs.pending_artifact != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the upload action
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Commit the result files to the results repository
        uses: ./.github/actions/upload-results
        with:
          artifact-name: ${{ needs.benchmarks.outputs.pending_artifact }}
          runner-label: ${{ inputs.runner }}
          results-upload-token: ${{ secrets.RESULTS_UPLOAD_TOKEN }}
          results-repository: ${{ inputs.results_repository }}
          results-branch: ${{ inputs.results_branch }}
