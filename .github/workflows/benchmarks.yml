# Reusable workflow: runs the NWB Benchmarks suite on ONE self-hosted runner and
# commits the results to the results repository with that runner's own token.
#
# Do not schedule this workflow directly. Each runner (or "situation") gets its own small
# caller workflow, generated from templates/runner-workflow.yml, which picks the schedule,
# names the runner label, describes the machine through the inputs below, and passes the
# runner's repository secret (RESULTS_UPLOAD_TOKEN_<LABEL>) as RESULTS_UPLOAD_TOKEN.
name: Benchmarks

on:
  workflow_call:
    inputs:
      # --- Which runner -----------------------------------------------------------------
      runner:
        description: Label of the self-hosted runner to run on.
        required: true
        type: string

      # --- What to run ------------------------------------------------------------------
      nwb_benchmarks_repository:
        description: GitHub repository (owner/name) containing the benchmark suite.
        required: false
        type: string
        default: NeurodataWithoutBorders/nwb-benchmarks
      nwb_benchmarks_ref:
        description: Branch, tag, or commit of the benchmark suite to run.
        required: false
        type: string
        default: main
      benchmark_pattern:
        description: Optional `--bench` pattern selecting a subset of the suite. Empty runs everything.
        required: false
        type: string
        default: ""
      debug:
        description: Run with `--debug` (one repeat, verbose output, nothing uploaded). Use it to smoke-test a new runner.
        required: false
        type: boolean
        default: false
      upload:
        description: Upload the results to the results repository.
        required: false
        type: boolean
        default: true
      timeout_minutes:
        description: Maximum duration of the job in minutes.
        required: false
        type: number
        default: 720

      # --- Machine configuration (all optional) -----------------------------------------
      conda_root:
        description: Root of the conda installation (the directory containing etc/profile.d/conda.sh). Auto-detected when empty.
        required: false
        type: string
        default: ""
      conda_env_name:
        description: Name of the conda environment created at the start and removed at the end of every job.
        required: false
        type: string
        default: nwb_benchmarks_runner
      network_interface:
        description: Network interface for the network tracking benchmarks (en0, eth0, Ethernet, ...). Default route interface when empty.
        required: false
        type: string
        default: ""
      tshark_path:
        description: Absolute path of the tshark executable. `tshark` on PATH when empty.
        required: false
        type: string
        default: ""
      use_sudo:
        description: "`auto` uses sudo when it works without a password, `true` requires it, `false` never uses it."
        required: false
        type: string
        default: auto
      cache_directory:
        description: Directory for the suite's downloads and temporary files (`nwb_benchmarks config_set_cache`). Default when empty.
        required: false
        type: string
        default: ""
      keep_conda_env:
        description: Keep the conda environment after the job for inspection.
        required: false
        type: boolean
        default: false

      # --- Upload configuration ---------------------------------------------------------
      results_repository:
        description: Repository (owner/name) the token pushes to. In `pull-request` mode, the contributor's fork.
        required: false
        type: string
        default: NeurodataWithoutBorders/nwb-benchmarks-results
      results_branch:
        description: Branch pushed to in `push` mode.
        required: false
        type: string
        default: main
      upload_mode:
        description: "`push` commits straight to results_branch; `pull-request` pushes a branch and opens a pull request against upstream_repository."
        required: false
        type: string
        default: push
      upstream_repository:
        description: "`pull-request` mode: repository that receives the pull request."
        required: false
        type: string
        default: NeurodataWithoutBorders/nwb-benchmarks-results
      upstream_branch:
        description: "`pull-request` mode: base branch of the pull request."
        required: false
        type: string
        default: main

    secrets:
      RESULTS_UPLOAD_TOKEN:
        description: >-
          Token with write access to results_repository. Pass this runner's repository secret
          (convention: RESULTS_UPLOAD_TOKEN_<LABEL>, e.g. secrets.RESULTS_UPLOAD_TOKEN_LBL_MAC).
          Not needed when upload is false or debug is true.
        required: false

permissions:
  contents: read

jobs:
  benchmarks:
    name: ${{ inputs.runner }}
    runs-on:
      - self-hosted
      - ${{ inputs.runner }}
    # Never run two benchmark jobs on the same machine at once; a second trigger waits.
    concurrency:
      group: nwb-benchmarks-${{ inputs.runner }}
      cancel-in-progress: false
    timeout-minutes: ${{ inputs.timeout_minutes }}
    defaults:
      run:
        shell: bash
    env:
      RUNNER_LABEL: ${{ inputs.runner }}
      NWB_BENCHMARKS_CLONE_DIR: ${{ github.workspace }}/nwb-benchmarks
      NWB_BENCHMARKS_CONDA_ENV: ${{ inputs.conda_env_name }}
      CONDA_ROOT: ${{ inputs.conda_root }}
      TSHARK_PATH: ${{ inputs.tshark_path }}
      NWB_BENCHMARKS_NETWORK_INTERFACE: ${{ inputs.network_interface }}
      NWB_BENCHMARKS_USE_SUDO: ${{ inputs.use_sudo }}
      NWB_BENCHMARKS_CACHE_DIRECTORY: ${{ inputs.cache_directory }}
      NWB_BENCHMARKS_KEEP_CONDA_ENV: ${{ inputs.keep_conda_env }}

    steps:
      - name: Check out runner scripts
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      # Fail in seconds rather than after hours of benchmarking when the token is missing.
      - name: Check that an upload token was passed
        if: ${{ !inputs.debug && inputs.upload }}
        env:
          RESULTS_UPLOAD_TOKEN: ${{ secrets.RESULTS_UPLOAD_TOKEN }}
        run: |
          if [ -z "$RESULTS_UPLOAD_TOKEN" ]; then
            echo "::error::No upload token was passed for runner '$RUNNER_LABEL'. Add a repository secret for this runner (convention: RESULTS_UPLOAD_TOKEN_<LABEL>) and pass it as RESULTS_UPLOAD_TOKEN in the runner's workflow file, or run with upload disabled."
            exit 1
          fi
          echo "Upload token present."

      - name: Describe runner
        run: |
          echo "Runner label:  $RUNNER_LABEL"
          echo "Runner name:   ${RUNNER_NAME:-unknown}"
          echo "User:          $(id -un)"
          echo "System:        $(uname -a)"
          echo "Workspace:     $GITHUB_WORKSPACE"
          echo "Disk:"
          df -h "$GITHUB_WORKSPACE" || true

      - name: Clone nwb-benchmarks
        env:
          REPOSITORY: ${{ inputs.nwb_benchmarks_repository }}
          REF: ${{ inputs.nwb_benchmarks_ref }}
        run: |
          if [ -e "$NWB_BENCHMARKS_CLONE_DIR" ]; then
            # Leftovers from an earlier run may be root-owned if it used sudo.
            rm -rf "$NWB_BENCHMARKS_CLONE_DIR" || sudo -n rm -rf "$NWB_BENCHMARKS_CLONE_DIR"
          fi
          git clone --quiet "https://github.com/${REPOSITORY}.git" "$NWB_BENCHMARKS_CLONE_DIR"
          git -C "$NWB_BENCHMARKS_CLONE_DIR" checkout --quiet "$REF"
          echo "nwb-benchmarks ${REPOSITORY}@${REF} is at commit $(git -C "$NWB_BENCHMARKS_CLONE_DIR" rev-parse HEAD)"

      - name: Set up conda environment
        run: bash scripts/setup_environment.sh

      - name: Run benchmarks
        id: run
        env:
          BENCHMARK_PATTERN: ${{ inputs.benchmark_pattern }}
          DEBUG_MODE: ${{ inputs.debug }}
          # Both paths are picked up by the artifact step below.
          RUNNER_LOG_FILE: ${{ runner.temp }}/nwb-benchmarks-run.log
          RUNNER_ARTIFACT_DIR: ${{ runner.temp }}/nwb-benchmarks-artifact
        run: bash scripts/run_benchmarks.sh

      - name: Upload results to the results repository
        if: ${{ !inputs.debug && inputs.upload }}
        env:
          RESULTS_UPLOAD_TOKEN: ${{ secrets.RESULTS_UPLOAD_TOKEN }}
          RESULTS_REPOSITORY: ${{ inputs.results_repository }}
          RESULTS_BRANCH: ${{ inputs.results_branch }}
          RESULTS_UPLOAD_MODE: ${{ inputs.upload_mode }}
          RESULTS_UPSTREAM_REPOSITORY: ${{ inputs.upstream_repository }}
          RESULTS_UPSTREAM_BRANCH: ${{ inputs.upstream_branch }}
        run: bash scripts/upload_results.sh

      - name: Save console log and result files as a workflow artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nwb-benchmarks-${{ inputs.runner }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/nwb-benchmarks-run.log
            ${{ runner.temp }}/nwb-benchmarks-artifact/
          if-no-files-found: ignore
          retention-days: 30

      - name: Clean up
        if: always()
        env:
          USED_SUDO: ${{ steps.run.outputs.used_sudo }}
        run: bash scripts/cleanup.sh
