# Formatting and hygiene checks from .pre-commit-config.yaml (md-lines for Markdown,
# whitespace, YAML/JSON validity, workflow schema, codespell).
# Runs on GitHub-hosted runners only; the self-hosted runners are never exposed to pull requests.
name: pre-commit

on:
  pull_request:
  push:
    branches:
      - dev

permissions:
  contents: read

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          # md-lines needs Python 3.13 or newer; see default_language_version in the config.
          python-version: "3.13"
      - uses: pre-commit/action@v3.0.1
